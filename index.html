<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Dobble 座標標註工具</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body { margin: 0; display: flex; font-family: sans-serif; background: #1a1a1a; color: white; height: 100vh; overflow: hidden; }
        
        /* 左側畫布 */
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .card-container { position: relative; width: 85vh; max-width: 95vw; aspect-ratio: 1/1; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        /* 熱區圓圈 */
        .dot { 
            position: absolute; width: 15%; aspect-ratio: 1/1; border-radius: 50%; 
            background: rgba(0, 150, 255, 0.4); border: 2px solid #00aaff; 
            transform: translate(-50%, -50%); cursor: grab; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: white; font-weight: bold; font-size: 0.8rem; text-shadow: 1px 1px 2px black; 
            z-index: 10; text-align: center; line-height: 1.1; pointer-events: auto;
        }
        .dot.selected { border-color: #ffeb3b; background: rgba(255, 235, 59, 0.5); z-index: 11; box-shadow: 0 0 15px #ffeb3b; }
        .dot.dragging { cursor: grabbing; background: rgba(0, 255, 0, 0.4); border-color: #00ff00; }

        /* 右側控制列 */
        .sidebar { width: 420px; background: #222; display: flex; flex-direction: column; border-left: 2px solid #444; height: 100vh; }
        
        /* 可折疊的設定區塊 */
        .settings-toggle {
            background: #333; color: #e09d32; padding: 15px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #444; user-select: none; transition: 0.2s;
        }
        .settings-toggle:hover { background: #444; }
        .settings-toggle .arrow { transition: transform 0.3s; font-size: 1.2rem; }
        .settings-toggle.collapsed .arrow { transform: rotate(-90deg); } /* 收起時箭頭轉向 */

        /* 設定區塊的內容 */
        .settings-content {
            max-height: 550px; /* 預設最大高度 */
            overflow-y: auto;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #222;
        }
        .settings-content.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            overflow: hidden;
        }
        
        input[type="file"], input[type="text"] { padding: 8px; background: #333; border-radius: 5px; border: 1px solid #555; color: white; width: 100%; font-size: 0.9rem; }
        select, button, input[type="range"] { padding: 10px; font-size: 0.95rem; border-radius: 5px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
        button { background: #e09d32; color: white; }
        button:hover { background: #d18d22; }
        button.primary { background: #4CAF50; }
        button.primary:hover { background: #45a049; }
        
        .slider-box { background: #111; padding: 10px; border-radius: 8px; display: none; }
        input[type="range"] { padding: 0; margin-top: 5px; }
        
        .hint { font-size: 0.8rem; color: #aaa; line-height: 1.3; }
        .section-title { color: #e09d32; font-size: 0.85rem; font-weight: bold; margin-top: 5px;}
        #imgStatus { color: #4CAF50; font-weight: bold; font-size: 0.85rem; text-align: center; }

        /* JSON 區塊 (佔用剩下的所有空間) */
        .json-section { 
            flex: 1; /* 核心：撐滿剩餘高度 */
            display: flex; 
            flex-direction: column; 
            background: #1a1a1a;
            border-top: 2px solid #444;
            padding: 10px;
            min-height: 0; /* 允許縮小 */
        }
        .json-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 5px;
        }
        .json-header span { font-size: 0.9rem; color: #4CAF50; font-weight: bold; }
        textarea { 
            width: 100%; 
            flex: 1; /* 填滿容器 */
            background: #111; 
            color: #0f0; 
            font-family: monospace; 
            font-size: 0.85rem; 
            padding: 10px; 
            border-radius: 5px; 
            border: 1px solid #555; 
            resize: none; 
            outline: none;
        }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="card-container" id="cardContainer">
            <img id="cardImg" class="card-img" src="" alt="Card">
            <div id="dotsContainer"></div>
        </div>
    </div>

    <div class="sidebar">
        
        <!-- 可折疊的標題列 -->
        <div class="settings-toggle" id="settingsToggle">
            <span>⚙️ 設定與控制區塊</span>
            <span class="arrow">▼</span>
        </div>

        <!-- 可折疊的內容 (包含上傳、選單等) -->
        <div class="settings-content" id="settingsContent">
            <div class="section-title">1. 上傳 JSON</div>
            <input type="file" id="jsonUpload" accept=".json">
            
            <div class="section-title">2. 載入圖片 (二選一)</div>
            <input type="file" id="folderUpload" webkitdirectory directory multiple>
            <div id="imgStatus">尚未載入</div>
            <input type="text" id="baseUrlInput" placeholder="或貼上網址...">
            
            <div class="section-title">3. 選擇卡片</div>
            <select id="cardSelect"></select>

            <div class="slider-box" id="sliderBox">
                <label style="color:#00aaff;">選取圓圈 (<span id="selectedIdx">-</span>) 半徑：<span id="rVal">0.15</span></label>
                <input type="range" id="radiusSlider" min="0.05" max="0.30" step="0.01" value="0.15">
            </div>

            <button id="exportBtn" class="primary" style="margin-top: 10px;">📋 匯出最終 JSON</button>
        </div>

        <!-- 下方的 JSON 檢視區 -->
        <div class="json-section">
            <div class="json-header">
                <span>📄 JSON 輸出結果</span>
                <span style="color:#aaa; font-size:0.8rem; cursor:pointer;" onclick="copyJson()">📋 點擊複製</span>
            </div>
            <textarea id="outputJson" readonly placeholder="點擊上方「匯出最終 JSON」後，這裡會顯示結果..."></textarea>
        </div>

    </div>

    <script>
        // --- 折疊邏輯 ---
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsContent = document.getElementById('settingsContent');
        
        settingsToggle.addEventListener('click', () => {
            settingsToggle.classList.toggle('collapsed');
            settingsContent.classList.toggle('collapsed');
        });

        // --- 複製 JSON 快捷鍵 ---
        window.copyJson = function() {
            const textarea = document.getElementById('outputJson');
            if (!textarea.value) return alert('目前沒有內容可複製！');
            textarea.select();
            document.execCommand('copy');
            alert('✅ 已複製到剪貼簿！');
        };

        // --- 核心邏輯 ---
        let rawData = null;
        let wordBank = [];
        let cardsData = [];
        
        let currentCardIndex = 0;
        let localCardsHotspots = []; 
        let selectedIndex = -1;
        let draggedDot = null;

        let localImageMap = {};

        const defaultHotspots = [
            { x: 0.190, y: 0.189, r: 0.12 }, { x: 0.501, y: 0.190, r: 0.12 }, { x: 0.808, y: 0.192, r: 0.12 },
            { x: 0.189, y: 0.500, r: 0.12 }, { x: 0.498, y: 0.628, r: 0.17 }, { x: 0.809, y: 0.500, r: 0.12 },
            { x: 0.187, y: 0.810, r: 0.12 }, { x: 0.812, y: 0.811, r: 0.12 }
        ];

        document.getElementById('jsonUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                rawData = JSON.parse(ev.target.result);
                wordBank = rawData.wordBank;
                cardsData = rawData.cardsData;

                if (!document.getElementById('baseUrlInput').value) {
                    document.getElementById('baseUrlInput').value = rawData.imageBaseUrl || "";
                }

                localCardsHotspots = cardsData.map(() => defaultHotspots.map(h => ({...h})));

                const select = document.getElementById('cardSelect');
                select.innerHTML = '';
                cardsData.forEach((_, i) => {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = `卡片 ${i + 1}`;
                    select.appendChild(opt);
                });

                loadCard(0);
            };
            reader.readAsText(file);
        });

        document.getElementById('folderUpload').addEventListener('change', (e) => {
            const files = e.target.files;
            localImageMap = {}; 
            
            let count = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.type.startsWith('image/')) {
                    localImageMap[file.name] = URL.createObjectURL(file);
                    count++;
                }
            }
            
            document.getElementById('imgStatus').innerText = `✅ 已載入 ${count} 張`;
            loadCard(currentCardIndex); 
        });

        document.getElementById('cardSelect').addEventListener('change', (e) => {
            loadCard(parseInt(e.target.value));
        });

        function loadCard(index) {
            currentCardIndex = index;
            const fileName = `${index + 1}.png`;
            
            if (localImageMap[fileName]) {
                document.getElementById('cardImg').src = localImageMap[fileName];
            } else {
                let base = document.getElementById('baseUrlInput').value;
                if (base && !base.endsWith('/')) base += '/';
                document.getElementById('cardImg').src = base + fileName;
            }

            document.getElementById('cardSelect').value = index;
            selectedIndex = -1;
            document.getElementById('sliderBox').style.display = 'none';
            renderDots();
        }

        document.getElementById('baseUrlInput').addEventListener('change', () => loadCard(currentCardIndex));

        function renderDots() {
            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            
            const currentWords = cardsData[currentCardIndex].map(idx => wordBank[idx]);
            const hotspots = localCardsHotspots[currentCardIndex];

            hotspots.forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'dot';
                div.style.left = `${spot.x * 100}%`;
                div.style.top = `${spot.y * 100}%`;
                div.style.width = `${spot.r * 2 * 100}%`;
                div.innerHTML = `<span>${currentWords[i]}</span>`;
                
                if (selectedIndex === i) div.classList.add('selected');

                div.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    selectedIndex = i;
                    draggedDot = { index: i };
                    div.classList.add('dragging');
                    div.setPointerCapture(e.pointerId);
                    
                    document.getElementById('sliderBox').style.display = 'block';
                    document.getElementById('selectedIdx').innerText = currentWords[i];
                    document.getElementById('radiusSlider').value = spot.r;
                    document.getElementById('rVal').innerText = spot.r.toFixed(2);
                    
                    renderDots();
                });

                div.addEventListener('pointermove', (e) => {
                    if (!draggedDot || draggedDot.index !== i) return;
                    const rect = document.getElementById('cardContainer').getBoundingClientRect();
                    
                    let x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    let y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

                    localCardsHotspots[currentCardIndex][i].x = x;
                    localCardsHotspots[currentCardIndex][i].y = y;
                    
                    div.style.left = `${x * 100}%`;
                    div.style.top = `${y * 100}%`;
                });

                div.addEventListener('pointerup', () => {
                    if (draggedDot) {
                        div.classList.remove('dragging');
                        draggedDot = null;
                    }
                });

                container.appendChild(div);
            });
        }

        document.getElementById('radiusSlider').addEventListener('input', (e) => {
            if (selectedIndex === -1) return;
            const val = parseFloat(e.target.value);
            localCardsHotspots[currentCardIndex][selectedIndex].r = val;
            document.getElementById('rVal').innerText = val.toFixed(2);
            
            const dot = document.querySelector(`.dot.selected`);
            if (dot) dot.style.width = `${val * 2 * 100}%`;
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (!rawData) return;

            const newCardsData = cardsData.map((indices, i) => {
                return {
                    words: indices,
                    hotspots: localCardsHotspots[i]
                };
            });

            const finalJson = {
                ...rawData,
                cardsData: newCardsData
            };

            document.getElementById('outputJson').value = JSON.stringify(finalJson, null, 4);
            
            // 匯出後，自動把上面的設定區塊收起來，讓你專心看/複製 JSON
            settingsToggle.classList.add('collapsed');
            settingsContent.classList.add('collapsed');
            
            alert("✅ 匯出成功！\n設定選單已自動收起，你可以享受超大視窗來檢視或複製 JSON。");
        });
    </script>
</body>
</html>
