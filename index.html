<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dobble - 2 Player Battle</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* 右上角齒輪按鈕 (跳轉到 jsonEditor.html) */
        .settings-btn { position: absolute; top: 15px; right: 20px; z-index: 40; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.8rem; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; text-decoration: none;}
        .settings-btn:hover { transform: rotate(90deg); background: rgba(0,0,0,0.8); }

        .game-board { display: flex; width: 100%; height: 100%; position: relative; align-items: center; justify-content: center; gap: 20px; padding: 60px 20px 20px; }
        .player-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 100%; }
        .score-board { position: absolute; top: -35px; font-size: 1.2rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 6px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        
        .card-container { position: relative; width: 95%; max-width: 650px; aspect-ratio: 1/1; border-radius: 20px; background: #fff; cursor: pointer; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: 30px; }
        .card-rotator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center; }
        .player-area.left .card-rotator { transform: rotate(90deg); }
        .player-area.right .card-rotator { transform: rotate(-90deg); }
        .card-rotator img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        .hit-effect { position: absolute; aspect-ratio: 1/1; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 5; transform: translate(-50%, -50%); }
        .hit-effect.correct { background: rgba(46, 204, 113, 0.8); opacity: 1; border-color: #2ecc71; }
        .hit-effect.wrong { background: rgba(231, 76, 60, 0.8); opacity: 1; border-color: #e74c3c; }

        .center-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #fff; padding: 20px 50px; border-radius: 20px; font-size: 2rem; font-weight: bold; display: none; z-index: 20; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #e09d32; }
    </style>
</head>
<body>

    <a href="jsonEditor.html" class="settings-btn" title="Edit JSON">⚙️</a>

    <div class="game-board">
        <div class="player-area left" id="playerA">
            <div class="score-board">Player A: <span id="scoreA">0</span></div>
            <div class="card-container" id="cardContainerA">
                <div class="card-rotator" id="rotatorA">
                    <img id="imgA" src="" alt="Card A">
                </div>
                <div class="hit-effect" id="hitEffectA"></div>
            </div>
        </div>

        <div class="player-area right" id="playerB">
            <div class="score-board">Player B: <span id="scoreB">0</span></div>
            <div class="card-container" id="cardContainerB">
                <div class="card-rotator" id="rotatorB">
                    <img id="imgB" src="" alt="Card B">
                </div>
                <div class="hit-effect" id="hitEffectB"></div>
            </div>
        </div>
    </div>

    <div class="center-message" id="centerMsg">Game Start!</div>

    <script>
        let currentCards = [];
        let imageBaseUrl = "";
        let commonWord = "";
        let scoreA = 0, scoreB = 0;
        let roundActive = false;
        let cardA_Data = null, cardB_Data = null;
        let currentIdxA = -1, currentIdxB = -1;

        const imgA = document.getElementById('imgA');
        const imgB = document.getElementById('imgB');
        const hitEffectA = document.getElementById('hitEffectA');
        const hitEffectB = document.getElementById('hitEffectB');
        const scoreAElem = document.getElementById('scoreA');
        const scoreBElem = document.getElementById('scoreB');
        const centerMsg = document.getElementById('centerMsg');

        const rightAudio = new Audio('sounds/right.mp3');
        const wrongAudio = new Audio('sounds/wrong.mp3');

        async function init() {
            try {
                const res = await fetch('sets/Common_knowledge_NF.json');
                const data = await res.json();
                imageBaseUrl = data.imageBaseUrl;
                currentCards = data.cardsData;
                
                // 讀取暫存進度
                const savedState = sessionStorage.getItem('dobbleState');
                if (savedState) {
                    const state = JSON.parse(savedState);
                    scoreA = state.scoreA;
                    scoreB = state.scoreB;
                    currentIdxA = state.idxA;
                    currentIdxB = state.idxB;
                    
                    scoreAElem.innerText = scoreA;
                    scoreBElem.innerText = scoreB;
                    cardA_Data = currentCards[currentIdxA];
                    cardB_Data = currentCards[currentIdxB];
                    commonWord = findCommonWord(cardA_Data, cardB_Data);
                    
                    imgA.src = `${imageBaseUrl}${currentIdxA + 1}.png`;
                    imgB.src = `${imageBaseUrl}${currentIdxB + 1}.png`;
                    
                    roundActive = true;
                } else {
                    resetGame();
                }
            } catch (e) { console.error("Failed to load JSON", e); }
        }

        // 離開頁面時自動存檔
        window.addEventListener('beforeunload', () => {
            if (roundActive) {
                sessionStorage.setItem('dobbleState', JSON.stringify({
                    scoreA: scoreA,
                    scoreB: scoreB,
                    idxA: currentIdxA,
                    idxB: currentIdxB
                }));
            }
        });

        function resetGame() {
            sessionStorage.removeItem('dobbleState');
            scoreA = 0; scoreB = 0;
            scoreAElem.innerText = scoreA;
            scoreBElem.innerText = scoreB;
            centerMsg.style.display = 'none';
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
            nextRound();
        }

        function findCommonWord(cardA, cardB) {
            const setA = new Set(cardA.hotspots.map(h => h.word));
            for (let h of cardB.hotspots) {
                if (setA.has(h.word)) return h.word;
            }
            return null;
        }

        function nextRound() {
            if (currentCards.length < 2) return;
            let idxA, idxB;
            do {
                idxA = Math.floor(Math.random() * currentCards.length);
                idxB = Math.floor(Math.random() * currentCards.length);
                while (idxA === idxB) idxB = Math.floor(Math.random() * currentCards.length);
                commonWord = findCommonWord(currentCards[idxA], currentCards[idxB]);
            } while (!commonWord);

            currentIdxA = idxA;
            currentIdxB = idxB;
            cardA_Data = currentCards[idxA];
            cardB_Data = currentCards[idxB];

            imgA.src = `${imageBaseUrl}${idxA + 1}.png`;
            imgB.src = `${imageBaseUrl}${idxB + 1}.png`;

            roundActive = true;
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
        }

        function handlePlayerClick(event, player) {
            if (!roundActive) return;

            const isPlayerA = (player === 'A');
            const container = isPlayerA ? document.getElementById('cardContainerA') : document.getElementById('cardContainerB');
            const effect = isPlayerA ? hitEffectA : hitEffectB;
            const cardData = isPlayerA ? cardA_Data : cardB_Data;
            
            const rect = container.getBoundingClientRect();
            
            let displayX = (event.clientX - rect.left) / rect.width;
            let displayY = (event.clientY - rect.top) / rect.height;

            effect.style.left = `${displayX * 100}%`;
            effect.style.top = `${displayY * 100}%`;

            let clickX, clickY;
            if (isPlayerA) {
                clickX = displayY;
                clickY = 1 - displayX;
            } else {
                clickX = 1 - displayY;
                clickY = displayX;
            }

            let hitHotspot = null;
            let minDistance = Infinity;

            cardData.hotspots.forEach((spot) => {
                const dx = clickX - spot.x;
                const dy = clickY - spot.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist <= spot.r && dist < minDistance) {
                    minDistance = dist;
                    hitHotspot = spot;
                }
            });

            if (!hitHotspot) return; 

            effect.style.width = `${hitHotspot.r * 2 * 100}%`; 

            if (hitHotspot.word === commonWord) {
                effect.className = 'hit-effect correct';
                roundActive = false;
                rightAudio.play().catch(()=>{});
                
                if (isPlayerA) {
                    scoreA++; scoreAElem.innerText = scoreA;
                    centerMsg.innerText = "🎉 Player A Scores!";
                } else {
                    scoreB++; scoreBElem.innerText = scoreB;
                    centerMsg.innerText = "🎉 Player B Scores!";
                }
                centerMsg.style.display = 'block';
                
                setTimeout(() => { 
                    centerMsg.style.display = 'none'; 
                    nextRound(); 
                }, 2000);
            } else {
                effect.className = 'hit-effect wrong';
                wrongAudio.play().catch(()=>{});
                setTimeout(() => { effect.className = 'hit-effect'; }, 500);
            }
        }

        document.getElementById('cardContainerA').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'A'));
        document.getElementById('cardContainerB').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'B'));

        init();
    </script>
</body>
</html>
