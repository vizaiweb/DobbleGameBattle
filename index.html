<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dobble - Battle & VS COM</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        #start-overlay h1 { font-size: 2.5rem; margin: 0 0 10px 0; color: #e09d32; }
        #start-overlay p { color: #aaa; font-size: 1.1rem; margin-bottom: 20px;}

        /* 🆕 主題選擇下拉選單 */
        .theme-selection {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-selection label { font-size: 1.2rem; font-weight: bold; color: #ccc; }
        #themeSelect {
            padding: 10px 20px; font-size: 1.2rem; font-weight: bold;
            background: #333; color: white; border: 2px solid #555; border-radius: 10px;
            cursor: pointer; outline: none;
        }
        #themeSelect:hover { background: #444; }
        #themeSelect option { background: #222; color: white; }

        .mode-selection { display: flex; gap: 20px; margin-bottom: 30px; }
        .mode-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold;
            background: #333; color: white; border: 3px solid #555; border-radius: 15px;
            cursor: pointer; transition: 0.2s;
        }
        .mode-btn:hover { transform: scale(1.05); background: #444; }
        .mode-btn.selected { background: #4CAF50; border-color: #2E7D32; box-shadow: 0 0 15px rgba(76, 175, 80, 0.5); }

        .round-selection { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; margin-bottom: 30px; }
        .round-btn {
            padding: 10px 20px; font-size: 1.2rem; font-weight: bold;
            background: #333; color: white; border: 2px solid #555; border-radius: 10px;
            cursor: pointer; transition: 0.2s;
        }
        .round-btn:hover { background: #444; }
        .round-btn.selected { background: #e09d32; border-color: #b87c3a; }

        #startBtn {
            padding: 20px 60px; font-size: 1.5rem; font-weight: bold;
            background: #4CAF50; color: white; border: none; border-radius: 15px;
            cursor: pointer; box-shadow: 0 6px 0 #2E7D32; transition: 0.1s;
            margin-top: 10px;
        }
        #startBtn:active { transform: translateY(6px); box-shadow: 0 0 0 #2E7D32; }

        .game-controls {
            position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; z-index: 50; pointer-events: none;
        }
        .ctrl-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.2);
            width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .ctrl-btn:hover { background: rgba(0,0,0,0.8); transform: scale(1.1); }
        .ctrl-btn:active { transform: scale(0.95); }

        .round-display {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #e09d32; font-size: 1.2rem; font-weight: bold;
            padding: 8px 24px; border-radius: 30px; border: 2px solid #e09d32;
            z-index: 50; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .game-board { display: flex; width: 100%; height: 100%; position: relative; align-items: center; justify-content: center; gap: 20px; padding: 60px 20px 20px; }
        .player-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 100%; }
        .score-board { position: absolute; top: -35px; font-size: 1.2rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 6px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        
        .countdown-timer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 5rem; font-weight: bold; color: #e74c3c;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.8);
            z-index: 15; pointer-events: none; display: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .card-container { position: relative; width: 95%; max-width: 650px; aspect-ratio: 1/1; border-radius: 20px; background: #fff; cursor: pointer; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: 30px; }
        .card-rotator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center; }
        .player-area.left .card-rotator { transform: rotate(90deg); }
        .player-area.right .card-rotator { transform: rotate(-90deg); }
        .card-rotator img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        .hit-effect { position: absolute; aspect-ratio: 1/1; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 5; transform: translate(-50%, -50%); }
        .hit-effect.correct { background: rgba(46, 204, 113, 0.8); opacity: 1; border-color: #2ecc71; }
        .hit-effect.wrong { background: rgba(231, 76, 60, 0.8); opacity: 1; border-color: #e74c3c; }

        .center-message { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.9); color: #fff; padding: 30px 60px; border-radius: 25px; 
            font-size: 1.8rem; font-weight: bold; display: none; z-index: 20; text-align: center; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.7); border: 3px solid #e09d32; 
            pointer-events: auto;
        }
        .center-message .word-display { 
            font-size: 3rem; color: #2ecc71; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; 
            cursor: pointer; transition: 0.2s;
        }
        .center-message .word-display:hover { transform: scale(1.05); }

        #orientation-blocker { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 30px; }
        #orientation-blocker h2 { font-size: 1.5rem; margin-bottom: 20px; color: #e09d32;}
        #orientation-blocker .icon { font-size: 4rem; margin-bottom: 20px; animation: rotatePhone 2s infinite ease-in-out; }
        @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
        @media (orientation: portrait) { #orientation-blocker { display: flex; } .game-board { display: none; } }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>Dobble Battle</h1>
        
        <!-- 🆕 主題選擇 -->
        <div class="theme-selection">
            <label>Theme:</label>
            <select id="themeSelect">
                <option value="">Loading...</option>
            </select>
        </div>

        <p>Select Game Mode & Rounds</p>
        
        <div class="mode-selection">
            <button class="mode-btn selected" id="modeBattle">👥 BATTLE</button>
            <button class="mode-btn" id="modeCom">🤖 VS COM</button>
        </div>

        <div class="round-selection" id="roundSelection">
            <button class="round-btn" data-rounds="1">1</button>
            <button class="round-btn" data-rounds="3">3</button>
            <button class="round-btn selected" data-rounds="5">5</button>
            <button class="round-btn" data-rounds="10">10</button>
            <button class="round-btn" data-rounds="20">20</button>
            <button class="round-btn" data-rounds="30">30</button>
            <button class="round-btn" data-rounds="40">40</button>
            <button class="round-btn" data-rounds="50">50</button>
            <button class="round-btn" data-rounds="57">57</button>
        </div>

        <button id="startBtn">🔊 Click to Start</button>
    </div>

    <div id="orientation-blocker">
        <div class="icon">📱</div>
        <h2>Please Rotate Your Device</h2>
        <p style="color:#aaa;">This game requires landscape mode.</p>
    </div>

    <div class="game-controls">
        <button class="ctrl-btn" id="exitBtn" title="Exit to Menu">❌</button>
        <button class="ctrl-btn" id="restartBtn" title="Restart Game">🔄</button>
    </div>

    <div class="round-display" id="roundDisplay">Round: 1 / 5</div>

    <div class="game-board">
        <div class="player-area left" id="playerA">
            <div class="score-board">Player A: <span id="scoreA">0</span></div>
            <div class="card-container" id="cardContainerA">
                <div class="card-rotator" id="rotatorA">
                    <img id="imgA" src="" alt="Card A">
                </div>
                <div class="hit-effect" id="hitEffectA"></div>
            </div>
        </div>

        <div class="player-area right" id="playerB">
            <div class="score-board" id="scoreLabelB">Player B: <span id="scoreB">0</span></div>
            <div class="card-container" id="cardContainerB">
                <div class="card-rotator" id="rotatorB">
                    <img id="imgB" src="" alt="Card B">
                </div>
                <div class="hit-effect" id="hitEffectB"></div>
            </div>
        </div>
        
        <div class="countdown-timer" id="countdownTimer">5</div>
    </div>

    <div class="center-message" id="centerMsg"></div>

    <script>
        let currentCards = [];
        let imageBaseUrl = "";
        let imageExtension = ".png"; 
        let commonWord = "";
        let scoreA = 0, scoreB = 0;
        let roundActive = false;
        let cardA_Data = null, cardB_Data = null;
        let currentIdxA = -1, currentIdxB = -1;

        let gameMode = "BATTLE"; 
        let maxRounds = 5;
        let currentRound = 0;
        
        let comboA = 0, comboB = 0;
        let mistakesA = 0, mistakesB = 0;

        let countdownInterval = null;
        let comTimeout = null;

        const imgA = document.getElementById('imgA');
        const imgB = document.getElementById('imgB');
        const hitEffectA = document.getElementById('hitEffectA');
        const hitEffectB = document.getElementById('hitEffectB');
        const scoreAElem = document.getElementById('scoreA');
        const scoreLabelB = document.getElementById('scoreLabelB');
        const centerMsg = document.getElementById('centerMsg');
        const countdownTimer = document.getElementById('countdownTimer');
        const roundDisplay = document.getElementById('roundDisplay');
        const themeSelect = document.getElementById('themeSelect');

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        let availableVoices = [];
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        function speakWord(word) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            let selectedVoice = availableVoices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));
            const preferredVoice = availableVoices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Microsoft Zira'));
            if (preferredVoice) selectedVoice = preferredVoice;
            if (selectedVoice) utterance.voice = selectedVoice;
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            window.speechSynthesis.speak(utterance);
        }

        // 🆕 初始化主題選單
        async function loadThemes() {
            try {
                const res = await fetch('sets/index.json');
                const data = await res.json();
                themeSelect.innerHTML = '';
                data.availableSets.forEach(set => {
                    const opt = document.createElement('option');
                    opt.value = set.id;
                    opt.textContent = set.name;
                    themeSelect.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load themes", e);
                themeSelect.innerHTML = '<option value="Common_knowledge_NF">Default Theme</option>';
            }
        }
        loadThemes();

        document.getElementById('modeBattle').addEventListener('click', () => {
            gameMode = "BATTLE";
            document.getElementById('modeBattle').classList.add('selected');
            document.getElementById('modeCom').classList.remove('selected');
        });

        document.getElementById('modeCom').addEventListener('click', () => {
            gameMode = "COM";
            document.getElementById('modeCom').classList.add('selected');
            document.getElementById('modeBattle').classList.remove('selected');
        });

        document.querySelectorAll('.round-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.round-btn').forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                maxRounds = parseInt(e.target.dataset.rounds);
            });
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('start-overlay').style.display = 'none';
            startGame();
        });

        document.getElementById('exitBtn').addEventListener('click', () => {
            stopAllTimers();
            roundActive = false;
            centerMsg.style.display = 'none';
            roundDisplay.style.display = 'none';
            document.getElementById('start-overlay').style.display = 'flex';
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            stopAllTimers();
            roundActive = false;
            centerMsg.style.display = 'none';
            startGame();
        });

        function stopAllTimers() {
            clearInterval(countdownInterval);
            clearTimeout(comTimeout);
            countdownTimer.style.display = 'none';
        }

        function startGame() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(' ');
                u.volume = 0;
                window.speechSynthesis.speak(u);
            }

            scoreA = 0; scoreB = 0;
            currentRound = 0;
            comboA = 0; comboB = 0;
            mistakesA = 0; mistakesB = 0;
            scoreAElem.innerText = scoreA;
            
            if (gameMode === "COM") {
                scoreLabelB.innerHTML = `COM: <span id="scoreB">0</span>`;
            } else {
                scoreLabelB.innerHTML = `Player B: <span id="scoreB">0</span>`;
            }

            roundDisplay.style.display = 'block';

            init();
        }

        async function init() {
            try {
                // 讀取目前選擇的主題
                const selectedTheme = themeSelect.value;
                const res = await fetch(`sets/${selectedTheme}.json`);
                const data = await res.json();
                imageBaseUrl = data.imageBaseUrl;
                currentCards = data.cardsData;
                
                await detectImageExtension();

                preloadImages();
                nextRound();
            } catch (e) { console.error("Failed to load JSON", e); }
        }

        function detectImageExtension() {
            return new Promise((resolve) => {
                const testImg = new Image();
                testImg.onload = () => { imageExtension = ".png"; resolve(); };
                testImg.onerror = () => {
                    const testImgJpeg = new Image();
                    testImgJpeg.onload = () => { imageExtension = ".jpeg"; resolve(); };
                    testImgJpeg.onerror = () => { imageExtension = ".png"; resolve(); }; 
                    testImgJpeg.src = `${imageBaseUrl}1.jpeg`;
                };
                testImg.src = `${imageBaseUrl}1.png`;
            });
        }

        function preloadImages() {
            for (let i = 0; i < currentCards.length; i++) {
                const img = new Image();
                img.src = `${imageBaseUrl}${i + 1}${imageExtension}`;
            }
        }

        function findCommonWord(cardA, cardB) {
            const setA = new Set(cardA.hotspots.map(h => h.word));
            for (let h of cardB.hotspots) {
                if (setA.has(h.word)) return h.word;
            }
            return null;
        }

        function nextRound() {
            if (currentRound >= maxRounds) {
                roundActive = false;
                roundDisplay.style.display = 'none';
                let finalMsg = "";
                if (scoreA > scoreB) finalMsg = "🏆 Player A Wins!";
                else if (scoreB > scoreA) finalMsg = gameMode === "COM" ? "🤖 Computer Wins!" : "🏆 Player B Wins!";
                else finalMsg = "🤝 It's a Tie!";

                centerMsg.innerHTML = `<div style="font-size:2.5rem; color:#e09d32;">${finalMsg}</div><div style="font-size:1.5rem; margin-top:10px;">Final Score: A ${scoreA} - ${scoreB} ${gameMode === "COM" ? "COM" : "B"}</div>`;
                centerMsg.style.display = 'block';
                return;
            }

            currentRound++;
            roundDisplay.innerText = `Round: ${currentRound} / ${maxRounds}`;

            let idxA, idxB;
            do {
                idxA = Math.floor(Math.random() * currentCards.length);
                idxB = Math.floor(Math.random() * currentCards.length);
                while (idxA === idxB) idxB = Math.floor(Math.random() * currentCards.length);
                commonWord = findCommonWord(currentCards[idxA], currentCards[idxB]);
            } while (!commonWord);

            currentIdxA = idxA;
            currentIdxB = idxB;
            cardA_Data = currentCards[idxA];
            cardB_Data = currentCards[idxB];

            imgA.src = `${imageBaseUrl}${idxA + 1}${imageExtension}`;
            imgB.src = `${imageBaseUrl}${idxB + 1}${imageExtension}`;

            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';

            roundActive = true;
            
            if (gameMode === "COM") {
                startCountdown();
            } else {
                countdownTimer.style.display = 'none';
            }
        }

        function startCountdown() {
            clearInterval(countdownInterval);
            clearTimeout(comTimeout);

            countdownTimer.style.display = 'block';
            let count = 5;
            countdownTimer.innerText = count;

            setTimeout(() => {
                if (!roundActive) return;
                
                countdownInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownTimer.innerText = count;
                        countdownTimer.style.animation = 'none';
                        countdownTimer.offsetHeight; 
                        countdownTimer.style.animation = 'pulse 1s infinite';
                    } else {
                        countdownTimer.style.display = 'none';
                        clearInterval(countdownInterval);
                        
                        if (roundActive && gameMode === "COM") {
                            handlePlayerClick(null, 'B', true);
                        }
                    }
                }, 1000);
            }, 2000);
        }

        function handlePlayerClick(event, player, isCom = false) {
            if (!roundActive) return;
            
            if (player === 'B' && gameMode === "COM" && !isCom) return;

            const isPlayerA = (player === 'A');
            const effect = isPlayerA ? hitEffectA : hitEffectB;
            const cardData = isPlayerA ? cardA_Data : cardB_Data;

            if (!isCom) {
                const container = isPlayerA ? document.getElementById('cardContainerA') : document.getElementById('cardContainerB');
                const rect = container.getBoundingClientRect();
                
                let displayX = (event.clientX - rect.left) / rect.width;
                let displayY = (event.clientY - rect.top) / rect.height;

                effect.style.left = `${displayX * 100}%`;
                effect.style.top = `${displayY * 100}%`;

                let clickX, clickY;
                if (isPlayerA) {
                    clickX = displayY;
                    clickY = 1 - displayX;
                } else {
                    clickX = 1 - displayY;
                    clickY = displayX;
                }

                let hitHotspot = null;
                let minDistance = Infinity;

                cardData.hotspots.forEach((spot) => {
                    const dx = clickX - spot.x;
                    const dy = clickY - spot.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist <= spot.r && dist < minDistance) {
                        minDistance = dist;
                        hitHotspot = spot;
                    }
                });

                if (!hitHotspot) return; 
                effect.style.width = `${hitHotspot.r * 2 * 100}%`; 

                if (hitHotspot.word === commonWord) {
                    winRound(isPlayerA, effect);
                } else {
                    handleWrong(isPlayerA, effect);
                }

            } else {
                const correctSpot = cardData.hotspots.find(h => h.word === commonWord);
                if (correctSpot) {
                    let displayX = 1 - correctSpot.y;
                    let displayY = correctSpot.x;
                    effect.style.left = `${displayX * 100}%`;
                    effect.style.top = `${displayY * 100}%`;
                    effect.style.width = `${correctSpot.r * 2 * 100}%`;
                    winRound(false, effect);
                }
            }
        }

        function winRound(isPlayerA, effect) {
            effect.className = 'hit-effect correct';
            roundActive = false;
            stopAllTimers();

            speakWord(commonWord);

            if(audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = 800; 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }

            highlightBothCorrectSpots();

            let points = 1;
            let comboMsg = "";
            
            if (isPlayerA) {
                comboA++;
                comboB = 0; 
                mistakesA = 0; 
                
                if (comboA >= 3 && comboA % 3 === 0) {
                    points += 3;
                    comboMsg = `<div style="color:#f1c40f; font-size:2rem;">🔥 COMBO X3! +3 Points!</div>`;
                }
                
                scoreA += points;
                scoreAElem.innerText = scoreA;
                
                let winnerText = "🎉 Player A Scores!";
                showCenterMsg(winnerText, comboMsg);
            } else {
                comboB++;
                comboA = 0;
                mistakesB = 0;
                
                if (comboB >= 3 && comboB % 3 === 0) {
                    points += 3;
                    comboMsg = `<div style="color:#f1c40f; font-size:2rem;">🔥 COMBO X3! +3 Points!</div>`;
                }
                
                scoreB += points;
                document.getElementById('scoreB').innerText = scoreB;
                
                let winnerText = gameMode === "COM" ? "🤖 Computer Scores!" : "🎉 Player B Scores!";
                showCenterMsg(winnerText, comboMsg);
            }

            setTimeout(() => { 
                centerMsg.style.display = 'none'; 
                nextRound(); 
            }, 2500);
        }

        function highlightBothCorrectSpots() {
            const spotA = cardA_Data.hotspots.find(h => h.word === commonWord);
            if (spotA) {
                let displayX_A = 1 - spotA.y;
                let displayY_A = spotA.x;
                hitEffectA.style.left = `${displayX_A * 100}%`;
                hitEffectA.style.top = `${displayY_A * 100}%`;
                hitEffectA.style.width = `${spotA.r * 2 * 100}%`;
                hitEffectA.className = 'hit-effect correct';
            }

            const spotB = cardB_Data.hotspots.find(h => h.word === commonWord);
            if (spotB) {
                let displayX_B = spotB.y;
                let displayY_B = 1 - spotB.x;
                hitEffectB.style.left = `${displayX_B * 100}%`;
                hitEffectB.style.top = `${displayY_B * 100}%`;
                hitEffectB.style.width = `${spotB.r * 2 * 100}%`;
                hitEffectB.className = 'hit-effect correct';
            }
        }

        function handleWrong(isPlayerA, effect) {
            effect.className = 'hit-effect wrong';
            
            if(audioCtx) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.value = 200;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
            
            setTimeout(() => { effect.className = 'hit-effect'; }, 500);

            let penaltyMsg = "";
            if (isPlayerA) {
                mistakesA++;
                comboA = 0;
                
                if (mistakesA >= 3) {
                    scoreA = Math.max(0, scoreA - 1);
                    scoreAElem.innerText = scoreA;
                    mistakesA = 0;
                    penaltyMsg = `<div style="color:#e74c3c; font-size:1.5rem;">❌ 3 Mistakes -1 Point!</div>`;
                }
            } else {
                mistakesB++;
                comboB = 0;
                
                if (mistakesB >= 3) {
                    scoreB = Math.max(0, scoreB - 1);
                    document.getElementById('scoreB').innerText = scoreB;
                    mistakesB = 0;
                    penaltyMsg = `<div style="color:#e74c3c; font-size:1.5rem;">❌ 3 Mistakes -1 Point!</div>`;
                }
            }

            if (penaltyMsg) {
                let loserText = isPlayerA ? "Player A" : (gameMode === "COM" ? "Computer" : "Player B");
                centerMsg.innerHTML = `
                    <div>${loserText} Penalized</div>
                    ${penaltyMsg}
                `;
                centerMsg.style.display = 'block';
                setTimeout(() => { 
                    if(roundActive) centerMsg.style.display = 'none';
                }, 1500);
            }
        }

        function showCenterMsg(title, extra) {
            centerMsg.innerHTML = `
                ${title}
                <div class="word-display" onclick="speakWord('${commonWord}')">${commonWord}</div>
                ${extra}
            `;
            centerMsg.style.display = 'block';
        }

        window.speakWord = speakWord;

        document.getElementById('cardContainerA').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'A'));
        document.getElementById('cardContainerB').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'B'));
    </script>
</body>
</html>
