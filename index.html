<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dobble 雙人對戰 - 測試版</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* 頂部控制列 */
        .top-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 15px; align-items: center; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.2); }
        .top-bar label { color: #fff; font-weight: bold; font-size: 0.9rem; }
        #themeSelect { padding: 8px 15px; border-radius: 20px; border: none; font-weight: bold; background: #e09d32; color: white; outline: none; cursor: pointer; }
        .btn { background: #e09d32; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 4px 0 #7b4a1a; transition: 0.1s; font-family: inherit; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #7b4a1a; }
        
        /* 遊戲主容器：左右分割 */
        .game-board { display: flex; width: 100%; height: 100%; position: relative; }
        
        /* 玩家區域 */
        .player-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; transition: background 0.3s; }
        /* 玩家 A 區域旋轉 180 度 */
        .player-area.left { transform: rotate(180deg); border-right: 4px dashed rgba(255,255,255,0.2); }
        
        /* 計分板 */
        .score-board { position: absolute; top: 20px; font-size: 1.5rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 8px 24px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .player-area.left .score-board { top: auto; bottom: 20px; }

        /* 卡片容器 */
        .card-container { position: relative; width: 85%; max-width: 500px; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); background: #fff; cursor: pointer; }
        .card-container img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        /* 點擊回饋特效 */
        .hit-effect { position: absolute; width: 20%; aspect-ratio: 1/1; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 5; }
        .hit-effect.correct { background: rgba(46, 204, 113, 0.8); opacity: 1; border-color: #2ecc71; }
        .hit-effect.wrong { background: rgba(231, 76, 60, 0.8); opacity: 1; border-color: #e74c3c; }
        
        /* 中央訊息 */
        .center-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #fff; padding: 20px 50px; border-radius: 20px; font-size: 2.5rem; font-weight: bold; display: none; z-index: 20; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #e09d32; }
        
        /* 載入中 */
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 1.2rem; }

        @media (orientation: portrait) {
            .game-board::after { content: '請將平板橫放以獲得最佳體驗'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 1.5rem; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 15px; z-index: 100; width: 80%; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <label>主題：</label>
        <select id="themeSelect"></select>
        <button class="btn" id="resetBtn">🔄 重新開始</button>
    </div>

    <div class="game-board">
        <div class="player-area left" id="playerA">
            <div class="score-board">玩家 A: <span id="scoreA">0</span></div>
            <div class="card-container" id="cardContainerA">
                <img id="imgA" src="" alt="Card A">
                <div class="hit-effect" id="hitEffectA"></div>
            </div>
        </div>

        <div class="player-area right" id="playerB">
            <div class="score-board">玩家 B: <span id="scoreB">0</span></div>
            <div class="card-container" id="cardContainerB">
                <img id="imgB" src="" alt="Card B">
                <div class="hit-effect" id="hitEffectB"></div>
            </div>
        </div>
    </div>

    <div class="center-message" id="centerMsg">遊戲開始！</div>

    <script>
        // ==========================================
        // 全局狀態
        // ==========================================
        let currentThemeId = null;
        let wordBank = [];
        let currentCards = [];
        let imageBaseUrl = "";
        let commonWord = "";
        
        let scoreA = 0, scoreB = 0;
        let roundActive = false;
        let cardA_Data = null, cardB_Data = null;

        const themeSelect = document.getElementById('themeSelect');
        const imgA = document.getElementById('imgA');
        const imgB = document.getElementById('imgB');
        const hitEffectA = document.getElementById('hitEffectA');
        const hitEffectB = document.getElementById('hitEffectB');
        const scoreAElem = document.getElementById('scoreA');
        const scoreBElem = document.getElementById('scoreB');
        const centerMsg = document.getElementById('centerMsg');
        
        const rightAudio = new Audio('sounds/right.mp3');
        const wrongAudio = new Audio('sounds/wrong.mp3');

        // ==========================================
        // 虛擬 8 點熱區 (測試版用)
        // ==========================================
        // 因為目前 JSON 沒有精確的 x,y 座標，這裡用一個 3x3 的網格來模擬 8 個圖案的位置。
        // 未來有標註工具後，可以替換成真正的 hotspots 陣列。
        const virtualHotspots = [
            { x: 0.20, y: 0.20 }, { x: 0.50, y: 0.20 }, { x: 0.80, y: 0.20 },
            { x: 0.20, y: 0.50 }, { x: 0.50, y: 0.50 }, { x: 0.80, y: 0.50 },
            { x: 0.20, y: 0.80 }, { x: 0.50, y: 0.80 }, { x: 0.80, y: 0.80 }
        ];

        // ==========================================
        // 1. 初始化與載入 JSON
        // ==========================================
        async function init() {
            try {
                const res = await fetch('sets/index.json');
                const data = await res.json();
                themeSelect.innerHTML = '';
                data.availableSets.forEach(set => {
                    const opt = document.createElement('option');
                    opt.value = set.id;
                    opt.textContent = set.name;
                    themeSelect.appendChild(opt);
                });
                themeSelect.addEventListener('change', () => loadTheme(themeSelect.value));
                await loadTheme(themeSelect.value);
            } catch (e) {
                console.error("載入 index.json 失敗", e);
                centerMsg.textContent = "載入主題失敗，請檢查 sets/index.json";
                centerMsg.style.display = 'block';
            }
        }

        async function loadTheme(themeId) {
            currentThemeId = themeId;
            try {
                const res = await fetch(`sets/${themeId}.json`);
                const data = await res.json();
                
                wordBank = data.wordBank;
                imageBaseUrl = data.imageBaseUrl;
                
                // 將 cardsData 的索引轉換成實際的單字陣列
                // 例如 [0,1,2...] -> ["Canada", "Mexico", "USA"...]
                currentCards = data.cardsData.map(indices => indices.map(idx => wordBank[idx]));
                
                resetGame();
            } catch (e) {
                console.error(`載入 ${themeId}.json 失敗`, e);
                centerMsg.textContent = `載入主題 ${themeId} 失敗`;
                centerMsg.style.display = 'block';
            }
        }

        // ==========================================
        // 2. 遊戲邏輯
        // ==========================================
        function resetGame() {
            scoreA = 0; scoreB = 0;
            scoreAElem.innerText = scoreA;
            scoreBElem.innerText = scoreB;
            centerMsg.style.display = 'none';
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
            nextRound();
        }

        function findCommonWord(cardA, cardB) {
            const setA = new Set(cardA);
            for (let word of cardB) {
                if (setA.has(word)) return word;
            }
            return null;
        }

        function nextRound() {
            if (currentCards.length < 2) return;
            
            // 隨機抽兩張不同的卡
            let idxA = Math.floor(Math.random() * currentCards.length);
            let idxB = Math.floor(Math.random() * currentCards.length);
            while (idxA === idxB) idxB = Math.floor(Math.random() * currentCards.length);

            cardA_Data = currentCards[idxA];
            cardB_Data = currentCards[idxB];
            commonWord = findCommonWord(cardA_Data, cardB_Data);

            // 載入圖片 (注意：JSON 中的 id 從 0 開始，但圖片檔名通常從 1 開始，所以 +1)
            imgA.src = `${imageBaseUrl}${idxA + 1}.png`;
            imgB.src = `${imageBaseUrl}${idxB + 1}.png`;

            roundActive = true;
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
            console.log(`新回合！共同圖案是：${commonWord}`);
        }

        // ==========================================
        // 3. 點擊判定 (核心)
        // ==========================================
        function handlePlayerClick(event, player) {
            if (!roundActive) return;

            const isPlayerA = (player === 'A');
            const container = isPlayerA ? document.getElementById('cardContainerA') : document.getElementById('cardContainerB');
            const effect = isPlayerA ? hitEffectA : hitEffectB;
            const cardData = isPlayerA ? cardA_Data : cardB_Data;
            
            const rect = container.getBoundingClientRect();
            
            // 計算點擊點在圖片內的相對比例 (0~1)
            let clickX = (event.clientX - rect.left) / rect.width;
            let clickY = (event.clientY - rect.top) / rect.height;

            // 【關鍵】玩家 A 的區域旋轉了 180 度，座標需要反轉
            if (isPlayerA) {
                clickX = 1 - clickX;
                clickY = 1 - clickY;
            }

            // 尋找最近的虛擬熱區 (取代真實座標)
            let hitIndex = -1;
            let minDistance = Infinity;
            virtualHotspots.forEach((spot, index) => {
                const dx = clickX - spot.x;
                const dy = clickY - spot.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < minDistance) {
                    minDistance = dist;
                    hitIndex = index;
                }
            });

            if (hitIndex === -1) return; // 理論上不會發生

            // 根據點擊的熱區索引，取得對應的單字
            // 注意：這裡假設卡牌上的圖案順序與 cardData 陣列順序一致
            // 例如第 0 個熱區對應 cardData[0]，第 1 個熱區對應 cardData[1]
            const hitWord = cardData[hitIndex];

            console.log(`玩家 ${player} 點擊了位置 ${hitIndex}，單字是：${hitWord}`);

            // 顯示特效
            effect.style.left = `${virtualHotspots[hitIndex].x * 100}%`;
            effect.style.top = `${virtualHotspots[hitIndex].y * 100}%`;

            if (hitWord === commonWord) {
                // 正確
                effect.className = 'hit-effect correct';
                roundActive = false;
                rightAudio.play().catch(()=>{});
                
                if (isPlayerA) {
                    scoreA++; scoreAElem.innerText = scoreA;
                    showCenterMessage("🎉 玩家 A 得分！");
                } else {
                    scoreB++; scoreBElem.innerText = scoreB;
                    showCenterMessage("🎉 玩家 B 得分！");
                }

                setTimeout(() => {
                    centerMsg.style.display = 'none';
                    nextRound();
                }, 2000);

            } else {
                // 錯誤
                effect.className = 'hit-effect wrong';
                wrongAudio.play().catch(()=>{});
                setTimeout(() => { effect.className = 'hit-effect'; }, 500);
            }
        }

        function showCenterMessage(text) {
            centerMsg.innerText = text;
            centerMsg.style.display = 'block';
        }

        // ==========================================
        // 4. 事件綁定
        // ==========================================
        document.getElementById('cardContainerA').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'A'));
        document.getElementById('cardContainerB').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'B'));
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        // 啟動
        init();
    </script>
</body>
</html>
