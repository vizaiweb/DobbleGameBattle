<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Dobble JSON 終極安全修改器</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; display: flex; font-family: sans-serif; background: #1a1a1a; color: white; height: 100vh; overflow: hidden; position: relative;}
        
        .workspace { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; transition: 0.3s; }
        .card-container { position: relative; width: 80vh; max-width: 95vw; aspect-ratio: 1/1; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }
        .card-img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        /* 【安全修正】強制正圓形，絕不變橢圓 */
        .hotspot { 
            position: absolute; aspect-ratio: 1/1; border-radius: 50%; 
            border: 2px dashed rgba(0, 150, 255, 0.6); background: rgba(0, 150, 255, 0.1);
            transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: transparent; transition: 0.2s; cursor: pointer;
        }
        .hotspot:hover { background: rgba(0, 150, 255, 0.4); border-color: #00aaff; }
        .hotspot.active { background: rgba(255, 235, 59, 0.5); border-color: #ffeb3b; color: white; text-shadow: 1px 1px 2px black; }

        .sidebar { width: 450px; background: #222; display: flex; flex-direction: column; border-left: 2px solid #444; height: 100vh; position: relative; transition: transform 0.3s ease, width 0.3s ease; z-index: 50; }
        .sidebar.collapsed { transform: translateX(100%); width: 0; border-left: none; }

        .toggle-sidebar-btn {
            position: absolute; top: 20px; left: -45px; width: 40px; height: 40px;
            background: #e09d32; color: white; border: none; border-radius: 8px 0 0 8px;
            cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
            box-shadow: -4px 0 10px rgba(0,0,0,0.3); transition: 0.2s;
        }

        .sidebar-content { padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; height: 100%; }
        
        h2 { margin: 0 0 5px 0; font-size: 1.2rem; color: #e09d32; }
        .hint { font-size: 0.85rem; color: #aaa; line-height: 1.4; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 10px;}
        
        input[type="file"], select, button { padding: 12px; font-size: 1rem; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; font-weight: bold; }
        input[type="file"] { background: #333; color: white; border: 1px solid #555; cursor: pointer; }
        select { background: #111; color: #fff; border: 1px solid #00aaff; cursor: pointer; }
        button { background: #4CAF50; color: white; cursor: pointer; transition: 0.1s; }
        button:hover { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .edit-panel { background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; display: none; flex-direction: column; gap: 10px; }
        .edit-panel.active { display: flex; }

        .slider-box { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .slider-val { color: #00aaff; font-weight: bold; min-width: 40px; text-align: right; }

        .fullscreen-json { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; z-index: 100; display: none; flex-direction: column; padding: 20px; }
        .fullscreen-json.active { display: flex; }
        .json-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .json-header h2 { margin: 0; color: #4CAF50; }
        textarea { width: 100%; flex: 1; background: #000; color: #0f0; font-family: monospace; font-size: 1rem; padding: 20px; border: 2px solid #333; border-radius: 10px; resize: none; outline: none; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="workspace">
        <div class="card-container" id="cardContainer">
            <img id="cardImg" class="card-img" src="" alt="Card">
            <div id="dotsContainer"></div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="toggle-sidebar-btn" id="toggleSidebarBtn">☰</button>
        <div class="sidebar-content">
            <h2>🛠️ JSON 修改器</h2>
            <div class="hint">
                1. 載入你的原始 JSON 與圖片<br>
                2. 點擊國旗修改文字與大小<br>
                3. 點擊「全螢幕檢視」下載安全 JSON
            </div>

            <input type="file" id="jsonUpload" accept=".json">
            <input type="file" id="folderUpload" webkitdirectory directory multiple>
            
            <select id="cardSelect" style="display:none;"></select>

            <div class="edit-panel" id="editPanel">
                <label style="color:#ffeb3b;">位置 <span id="posIndex">-</span> 的圖案是：</label>
                <select id="wordSelect"></select>
                
                <label style="color:#00aaff; margin-top: 10px;">熱區半徑 (r)：</label>
                <div class="slider-box">
                    <input type="range" id="radiusSlider" min="0.05" max="0.30" step="0.01" value="0.12">
                    <span class="slider-val" id="radiusVal">0.12</span>
                </div>
            </div>

            <button id="showFullJsonBtn" disabled style="background: #3498db; margin-top: 20px;">🔍 全螢幕檢視 JSON</button>
        </div>
    </div>

    <div class="fullscreen-json" id="fullscreenJson">
        <div class="json-header">
            <h2>📄 即時同步 JSON (安全模式)</h2>
            <div style="display:flex; gap:10px;">
                <button id="downloadBtn" style="background:#4CAF50; width:auto; padding: 10px 20px;">💾 下載 JSON</button>
                <button id="copyBtn" style="background:#e09d32; width:auto; padding: 10px 20px;">📋 複製</button>
                <button id="closeFullJsonBtn" style="background:#e74c3c; width:auto; padding: 10px 20px;">❌ 關閉</button>
            </div>
        </div>
        <textarea id="previewJson" readonly placeholder="JSON 會即時顯示在這裡..."></textarea>
    </div>

    <script>
        let rawData = null;
        let wordBank = [];
        let imageBaseUrl = "";
        let localImages = {};

        // 安全鎖定：固定完美九宮格座標，只允許修改 r (半徑)
        let perfectHotspots = [
            { x: 0.190, y: 0.189, r: 0.12 }, { x: 0.501, y: 0.190, r: 0.12 }, { x: 0.808, y: 0.192, r: 0.12 },
            { x: 0.189, y: 0.500, r: 0.12 }, { x: 0.498, y: 0.628, r: 0.17 }, { x: 0.809, y: 0.500, r: 0.12 },
            { x: 0.187, y: 0.810, r: 0.12 }, { x: 0.812, y: 0.811, r: 0.12 }
        ];

        let currentCardIdx = 0;
        let selectedPosIndex = -1;

        document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        document.getElementById('showFullJsonBtn').addEventListener('click', () => {
            document.getElementById('fullscreenJson').classList.add('active');
        });
        document.getElementById('closeFullJsonBtn').addEventListener('click', () => {
            document.getElementById('fullscreenJson').classList.remove('active');
        });

        // 【安全生成核心】保證輸出的 JSON 完美無缺
        function generatePreview() {
            if (!rawData) return;

            try {
                const finalCards = rawData.cardsData.map((indices, i) => {
                    const words = indices.map(idx => wordBank[idx]);
                    return {
                        cardId: i + 1,
                        words: indices, // 原始陣列連碰都不碰，保證不壞
                        hotspots: perfectHotspots.map((spot, hIndex) => ({
                            word: words[hIndex],
                            x: Number(spot.x.toFixed(3)),
                            y: Number(spot.y.toFixed(3)),
                            r: Number(spot.r.toFixed(3))
                        }))
                    };
                });

                const finalJson = { 
                    setId: rawData.setId,
                    setName: rawData.setName,
                    imageBaseUrl: rawData.imageBaseUrl,
                    wordBank: rawData.wordBank,
                    cardsData: finalCards,
                    answerCards: rawData.answerCards,
                    totalCards: rawData.totalCards,
                    wordsPerCard: rawData.wordsPerCard
                };

                // 雙重驗證，確保絕對合規
                const validatedString = JSON.stringify(JSON.parse(JSON.stringify(finalJson)), null, 4);
                document.getElementById('previewJson').value = validatedString;

            } catch (error) {
                alert("❌ JSON 生成異常！請重新整理網頁再試。\n錯誤: " + error.message);
            }
        }

        document.getElementById('jsonUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    rawData = JSON.parse(ev.target.result);
                    wordBank = rawData.wordBank;
                    imageBaseUrl = rawData.imageBaseUrl;
                    
                    const select = document.getElementById('cardSelect');
                    select.innerHTML = '';
                    rawData.cardsData.forEach((_, i) => {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.textContent = `卡片 ${i + 1}`;
                        select.appendChild(opt);
                    });
                    select.style.display = 'block';
                    select.addEventListener('change', (e) => loadCard(parseInt(e.target.value)));
                    
                    document.getElementById('showFullJsonBtn').disabled = false;
                    loadCard(0);
                } catch (err) {
                    alert("上傳的 JSON 檔案格式有誤，請確認是否為最原始版本。");
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('folderUpload').addEventListener('change', (e) => {
            localImages = {};
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                if (files[i].type.startsWith('image/')) {
                    localImages[files[i].name] = URL.createObjectURL(files[i]);
                }
            }
            loadCard(currentCardIdx);
        });

        function loadCard(index) {
            currentCardIdx = index;
            const fileName = `${index + 1}.png`;
            document.getElementById('cardImg').src = localImages[fileName] || (imageBaseUrl + fileName);

            const container = document.getElementById('dotsContainer');
            container.innerHTML = '';
            
            perfectHotspots.forEach((spot, i) => {
                const div = document.createElement('div');
                div.className = 'hotspot';
                div.style.left = `${spot.x * 100}%`;
                div.style.top = `${spot.y * 100}%`;
                div.style.width = `${spot.r * 2 * 100}%`; 
                div.innerText = i;
                div.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    openEditPanel(i);
                });
                container.appendChild(div);
            });

            document.getElementById('editPanel').classList.remove('active');
            selectedPosIndex = -1;
            generatePreview(); 
        }

        function openEditPanel(posIndex) {
            selectedPosIndex = posIndex;
            document.querySelectorAll('.hotspot').forEach((el, i) => el.classList.toggle('active', i === posIndex));
            document.getElementById('editPanel').classList.add('active');
            document.getElementById('posIndex').innerText = posIndex;

            const wordSelect = document.getElementById('wordSelect');
            const currentIdxInCard = rawData.cardsData[currentCardIdx][posIndex];
            const currentWord = wordBank[currentIdxInCard];

            wordSelect.innerHTML = '';
            wordBank.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.textContent = w;
                if (w === currentWord) opt.selected = true;
                wordSelect.appendChild(opt);
            });

            wordSelect.onchange = (e) => {
                const newWord = e.target.value;
                const newIndex = wordBank.indexOf(newWord);
                rawData.cardsData[currentCardIdx][posIndex] = newIndex;
                generatePreview(); 
            };

            const radiusSlider = document.getElementById('radiusSlider');
            const radiusVal = document.getElementById('radiusVal');
            radiusSlider.value = perfectHotspots[posIndex].r;
            radiusVal.innerText = perfectHotspots[posIndex].r.toFixed(2);

            radiusSlider.oninput = (e) => {
                const newR = parseFloat(e.target.value);
                perfectHotspots[posIndex].r = newR;
                radiusVal.innerText = newR.toFixed(2);
                
                const activeDot = document.querySelector(`.hotspot.active`);
                if (activeDot) activeDot.style.width = `${newR * 2 * 100}%`;
                
                generatePreview();
            };
        }

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const jsonString = document.getElementById('previewJson').value;
            if(!jsonString) return;
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${rawData.setId || 'Dobble'}.json`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 0);
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const ta = document.getElementById('previewJson');
            ta.select();
            document.execCommand('copy');
            alert("✅ 已複製到剪貼簿！");
        });
    </script>
</body>
</html>
