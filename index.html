<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dobble - 2 Player Battle</title>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; }
        
        /* 右上角齒輪按鈕 */
        .settings-btn { position: absolute; top: 15px; right: 20px; z-index: 40; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 1.8rem; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .settings-btn:hover { transform: rotate(90deg); background: rgba(0,0,0,0.8); }

        /* 設置選單面板 */
        .settings-panel { position: absolute; top: 75px; right: 20px; z-index: 40; background: rgba(30,30,30,0.95); border: 2px solid #e09d32; border-radius: 15px; padding: 20px; display: none; flex-direction: column; gap: 15px; width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .settings-panel.active { display: flex; }
        
        .settings-panel label { color: #fff; font-weight: bold; font-size: 0.9rem; }
        #themeSelect { padding: 10px; border-radius: 8px; border: none; font-weight: bold; background: #e09d32; color: white; outline: none; cursor: pointer; width: 100%; }
        
        .btn { background: #e09d32; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; box-shadow: 0 4px 0 #7b4a1a; transition: 0.1s; font-family: inherit; width: 100%; font-size: 1rem; text-align: center; }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #7b4a1a; }

        /* 遊戲主容器 */
        .game-board { display: flex; width: 100%; height: 100%; position: relative; align-items: center; justify-content: center; gap: 20px; padding: 60px 20px 20px; }
        .player-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; height: 100%; }
        
        /* 計分板 (往上移，不擋卡片) */
        .score-board { position: absolute; top: -35px; font-size: 1.2rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 6px 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
        
        /* 卡片容器 */
        .card-container { position: relative; width: 95%; max-width: 650px; aspect-ratio: 1/1; border-radius: 20px; background: #fff; cursor: pointer; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-top: 30px; }
        
        /* 內層旋轉群組 */
        .card-rotator { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center; }
        
        /* 旋轉設定 */
        .player-area.left .card-rotator { transform: rotate(90deg); }
        .player-area.right .card-rotator { transform: rotate(-90deg); }
        
        /* 圖片與熱區 */
        .card-rotator img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        
        /* 熱區顯示圈 */
        .hotspot-visual { 
            position: absolute; aspect-ratio: 1/1; border-radius: 50%; 
            background: rgba(255, 0, 0, 0.3); border: 2px solid red; 
            transform: translate(-50%, -50%); pointer-events: none; 
            display: none; z-index: 4; align-items: center; justify-content: center; 
            color: white; font-weight: bold; font-size: 1.2rem; 
        }

        /* 點擊回饋特效 */
        .hit-effect { position: absolute; aspect-ratio: 1/1; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 0.2s; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 5; transform: translate(-50%, -50%); }
        .hit-effect.correct { background: rgba(46, 204, 113, 0.8); opacity: 1; border-color: #2ecc71; }
        .hit-effect.wrong { background: rgba(231, 76, 60, 0.8); opacity: 1; border-color: #e74c3c; }

        /* 中央訊息 (改為英文) */
        .center-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #fff; padding: 20px 50px; border-radius: 20px; font-size: 2rem; font-weight: bold; display: none; z-index: 20; text-align: center; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #e09d32; }
    </style>
</head>
<body>

    <!-- 齒輪設置按鈕 -->
    <div class="settings-btn" id="settingsBtn">⚙️</div>

    <!-- 設置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div>
            <label>Theme:</label>
            <select id="themeSelect"></select>
        </div>
        <button class="btn" id="toggleHotspotBtn">👁️ Show Hotspots</button>
        <button class="btn" id="resetBtn">🔄 Restart Game</button>
    </div>

    <div class="game-board">
        <!-- Player A (Left) -->
        <div class="player-area left" id="playerA">
            <div class="score-board">Player A: <span id="scoreA">0</span></div>
            <div class="card-container" id="cardContainerA">
                <div class="card-rotator" id="rotatorA">
                    <img id="imgA" src="" alt="Card A">
                    <div id="hotspotsA"></div>
                </div>
                <div class="hit-effect" id="hitEffectA"></div>
            </div>
        </div>

        <!-- Player B (Right) -->
        <div class="player-area right" id="playerB">
            <div class="score-board">Player B: <span id="scoreB">0</span></div>
            <div class="card-container" id="cardContainerB">
                <div class="card-rotator" id="rotatorB">
                    <img id="imgB" src="" alt="Card B">
                    <div id="hotspotsB"></div>
                </div>
                <div class="hit-effect" id="hitEffectB"></div>
            </div>
        </div>
    </div>

    <div class="center-message" id="centerMsg">Game Start!</div>

    <script>
        let currentThemeId = null;
        let wordBank = [];
        let currentCards = [];
        let imageBaseUrl = "";
        let commonWord = "";
        
        let scoreA = 0, scoreB = 0;
        let roundActive = false;
        let cardA_Data = null, cardB_Data = null;

        const themeSelect = document.getElementById('themeSelect');
        const imgA = document.getElementById('imgA');
        const imgB = document.getElementById('imgB');
        const hitEffectA = document.getElementById('hitEffectA');
        const hitEffectB = document.getElementById('hitEffectB');
        const scoreAElem = document.getElementById('scoreA');
        const scoreBElem = document.getElementById('scoreB');
        const centerMsg = document.getElementById('centerMsg');
        const toggleHotspotBtn = document.getElementById('toggleHotspotBtn');
        
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');

        const rightAudio = new Audio('sounds/right.mp3');
        const wrongAudio = new Audio('sounds/wrong.mp3');

        // 你提供的精準座標
        const virtualHotspots = [
            { x: 0.187, y: 0.81, r: 0.12 },
            { x: 0.189, y: 0.5, r: 0.12 },
            { x: 0.19, y: 0.189, r: 0.12 },
            { x: 0.498, y: 0.628, r: 0.17 },
            { x: 0.501, y: 0.19, r: 0.12 },
            { x: 0.812, y: 0.811, r: 0.12 },
            { x: 0.809, y: 0.5, r: 0.12 },
            { x: 0.808, y: 0.192, r: 0.12 }
        ];

        // 齒輪選單開關
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });

        // 點擊其他地方關閉選單
        document.addEventListener('pointerdown', (e) => {
            if (!settingsPanel.contains(e.target) && e.target !== settingsBtn) {
                settingsPanel.classList.remove('active');
            }
        });

        async function init() {
            try {
                const res = await fetch('sets/index.json');
                const data = await res.json();
                themeSelect.innerHTML = '';
                data.availableSets.forEach(set => {
                    const opt = document.createElement('option');
                    opt.value = set.id;
                    opt.textContent = set.name;
                    themeSelect.appendChild(opt);
                });
                themeSelect.addEventListener('change', () => loadTheme(themeSelect.value));
                await loadTheme(themeSelect.value);
            } catch (e) {
                console.error("Failed to load index.json", e);
            }
        }

        async function loadTheme(themeId) {
            currentThemeId = themeId;
            try {
                const res = await fetch(`sets/${themeId}.json`);
                const data = await res.json();
                wordBank = data.wordBank;
                imageBaseUrl = data.imageBaseUrl;
                currentCards = data.cardsData.map(indices => indices.map(idx => wordBank[idx]));
                resetGame();
            } catch (e) {
                console.error(`Failed to load theme ${themeId}`, e);
            }
        }

        function resetGame() {
            scoreA = 0; scoreB = 0;
            scoreAElem.innerText = scoreA;
            scoreBElem.innerText = scoreB;
            centerMsg.style.display = 'none';
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
            nextRound();
        }

        function findCommonWord(cardA, cardB) {
            const setA = new Set(cardA);
            for (let word of cardB) {
                if (setA.has(word)) return word;
            }
            return null;
        }

        function drawHotspots() {
            const containerA = document.getElementById('hotspotsA');
            const containerB = document.getElementById('hotspotsB');
            containerA.innerHTML = '';
            containerB.innerHTML = '';

            virtualHotspots.forEach((spot, index) => {
                const createSpot = () => {
                    const div = document.createElement('div');
                    div.className = 'hotspot-visual';
                    div.style.left = `${spot.x * 100}%`;
                    div.style.top = `${spot.y * 100}%`;
                    div.style.width = `${spot.r * 2 * 100}%`;
                    div.innerText = index;
                    div.style.display = showHotspots ? 'flex' : 'none';
                    return div;
                };
                containerA.appendChild(createSpot());
                containerB.appendChild(createSpot());
            });
        }

        let showHotspots = false;
        toggleHotspotBtn.addEventListener('click', () => {
            showHotspots = !showHotspots;
            document.querySelectorAll('.hotspot-visual').forEach(el => {
                el.style.display = showHotspots ? 'flex' : 'none';
            });
            toggleHotspotBtn.innerText = showHotspots ? '👁️ Hide Hotspots' : '👁️ Show Hotspots';
        });

        function nextRound() {
            if (currentCards.length < 2) return;

            const testLimit = Math.min(8, currentCards.length);
            let idxA, idxB;
            do {
                idxA = Math.floor(Math.random() * testLimit);
                idxB = Math.floor(Math.random() * testLimit);
                while (idxA === idxB) idxB = Math.floor(Math.random() * testLimit);
                commonWord = findCommonWord(currentCards[idxA], currentCards[idxB]);
            } while (!commonWord);

            cardA_Data = currentCards[idxA];
            cardB_Data = currentCards[idxB];

            imgA.src = `${imageBaseUrl}${idxA + 1}.png`;
            imgB.src = `${imageBaseUrl}${idxB + 1}.png`;

            roundActive = true;
            hitEffectA.className = 'hit-effect';
            hitEffectB.className = 'hit-effect';
            
            drawHotspots();
        }

        function handlePlayerClick(event, player) {
            if (!roundActive) return;

            const isPlayerA = (player === 'A');
            const container = isPlayerA ? document.getElementById('cardContainerA') : document.getElementById('cardContainerB');
            const effect = isPlayerA ? hitEffectA : hitEffectB;
            const cardData = isPlayerA ? cardA_Data : cardB_Data;
            
            const rect = container.getBoundingClientRect();
            
            let displayX = (event.clientX - rect.left) / rect.width;
            let displayY = (event.clientY - rect.top) / rect.height;

            effect.style.left = `${displayX * 100}%`;
            effect.style.top = `${displayY * 100}%`;

            let clickX, clickY;

            if (isPlayerA) {
                clickX = displayY;
                clickY = 1 - displayX;
            } else {
                clickX = 1 - displayY;
                clickY = displayX;
            }

            let hitIndex = -1;
            let minDistance = Infinity;

            virtualHotspots.forEach((spot, index) => {
                const dx = clickX - spot.x;
                const dy = clickY - spot.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist <= spot.r && dist < minDistance) {
                    minDistance = dist;
                    hitIndex = index;
                }
            });

            if (hitIndex === -1) return; 

            const hitWord = cardData[hitIndex];
            effect.style.width = `${virtualHotspots[hitIndex].r * 2 * 100}%`; 

            if (hitWord === commonWord) {
                effect.className = 'hit-effect correct';
                roundActive = false;
                rightAudio.play().catch(()=>{});
                
                if (isPlayerA) {
                    scoreA++; scoreAElem.innerText = scoreA;
                    showCenterMessage("🎉 Player A Scores!");
                } else {
                    scoreB++; scoreBElem.innerText = scoreB;
                    showCenterMessage("🎉 Player B Scores!");
                }

                setTimeout(() => {
                    centerMsg.style.display = 'none';
                    nextRound();
                }, 2000);

            } else {
                effect.className = 'hit-effect wrong';
                wrongAudio.play().catch(()=>{});
                setTimeout(() => { effect.className = 'hit-effect'; }, 500);
            }
        }

        function showCenterMessage(text) {
            centerMsg.innerText = text;
            centerMsg.style.display = 'block';
        }

        document.getElementById('cardContainerA').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'A'));
        document.getElementById('cardContainerB').addEventListener('pointerdown', (e) => handlePlayerClick(e, 'B'));
        document.getElementById('resetBtn').addEventListener('click', resetGame);

        init();
    </script>
</body>
</html>
